<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Stream TV</title>
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <link href="./css/output.css" rel="stylesheet">
</head>

<body class="w-full h-full bg-[#0B1020] text-[#F8FAFC] min-h-screen">

    <!-- header -->
    <header class="bg-[#151D33] border-b border-[#293550]">
        <div class="flex flex-col sm:flex-row items-center p-4 gap-4 ">
            <img class="w-10" src="iptv-stream.webp" alt="logo">

            <h1 class="font-bold text-xl whitespace-nowrap">
                Smart Stream
            </h1>

            <input id="search-input"
                class="w-full px-4 py-2 bg-[#202B45] text-white border border-[#35425F] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#7C5CFC] placeholder-gray-400"
                type="text" placeholder="Search channels...">
        </div>
    </header>


    <main class="flex flex-col md:flex-row gap-4 p-4">

        <!-- aside -->
        <aside class="bg-[#151D33] flex flex-col fixed w-full h-full md:w-1/3 rounded-xl p-3 min-w-0">


            <div class="flex flex-wrap gap-3 mb-6">
                <button
                    class="category-btn bg-[#202B45] hover:bg-[#7C5CFC] text-white px-4 py-2 rounded-lg cursor-pointer transition "
                    data-category="All">☰ All</button>

                <button
                    class="category-btn bg-[#202B45] hover:bg-[#7C5CFC] text-yellow-200 px-4 py-2 rounded-lg cursor-pointer transition "
                    data-category="favorite">⭐ My Favorites</button>

                <button
                    class="category-btn bg-[#202B45] hover:bg-[#7C5CFC] text-red-500 px-4 py-2 rounded-lg cursor-pointer transition "
                    data-category="blacklist">🚫 Blacklisted</button>
            </div>
            <!-- category -->
            <div class=" flex flex-wrap gap-3 mb-6">



                <button
                    class="category-btn bg-[#202B45] hover:bg-[#7C5CFC] text-white px-4 py-2 rounded-lg cursor-pointer transition "
                    data-category="DOCUMENTAIRE">Documentaire</button>

                <button
                    class="category-btn bg-[#202B45] hover:bg-[#7C5CFC] text-white px-4 py-2 rounded-lg cursor-pointer transition "
                    data-category="SPORT">Sport</button>

                <button
                    class="category-btn bg-[#202B45] hover:bg-[#7C5CFC] text-white px-4 py-2 rounded-lg cursor-pointer transition "
                    data-category="NATIONAL">National</button>

                <button
                    class="category-btn bg-[#202B45] hover:bg-[#7C5CFC] text-white px-4 py-2 rounded-lg cursor-pointer transition "
                    data-category="DIVERTISSEMENT">Divertissement</button>

            </div>





            <button id="openBtn" class="bg-[#7C5CFC] hover:bg-purple-700 px-5 py-2 rounded-lg text-white font-semibold">
                + Add Channel
            </button>



            <dialog id="myModal"
                class="w-[calc(100%-2rem)] max-w-lg max-h-[90vh] rounded-2xl bg-[#151D33] text-white p-0 backdrop:bg-black/70">

                <div class="p-5 sm:p-7">

                    <!-- Modal Header -->
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl sm:text-2xl font-bold">
                            Add New Channel
                        </h2>

                        <button type="button" id="closeBtn" class="text-gray-400 hover:text-white text-2xl">
                            &times;
                        </button>
                    </div>


                    <form id="add-channel-form" class="flex flex-col gap-4">

                        <input type="text" id="channel-name" placeholder="Channel name" required
                            class="w-full px-4 py-3 rounded-lg bg-[#202B45] border border-[#35425F] focus:outline-none focus:ring-2 focus:ring-[#7C5CFC]">

                        <input type="text" id="channel-number" placeholder="Channel number" required
                            class="w-full px-4 py-3 rounded-lg bg-[#202B45] border border-[#35425F] focus:outline-none focus:ring-2 focus:ring-[#7C5CFC]">

                        <input type="text" id="channel-category" placeholder="Category" required
                            class="w-full px-4 py-3 rounded-lg bg-[#202B45] border border-[#35425F] focus:outline-none focus:ring-2 focus:ring-[#7C5CFC]">

                        <input type="text" id="channel-logo" placeholder="Logo URL"
                            class="w-full px-4 py-3 rounded-lg bg-[#202B45] border border-[#35425F] focus:outline-none focus:ring-2 focus:ring-[#7C5CFC]">


                        <div class="flex flex-col-reverse sm:flex-row gap-3 mt-2">

                            <button type="button" id="closeBtn"
                                class="w-full sm:w-1/2 bg-[#35425F] hover:bg-[#455575] py-3 rounded-lg">
                                Cancel
                            </button>

                            <button type="submit"
                                class="w-full sm:w-1/2 bg-[#7C5CFC] hover:bg-purple-700 py-3 rounded-lg font-semibold">
                                Add Channel
                            </button>

                        </div>

                    </form>
                </div>
            </dialog>




            <div id="channel-list" class="w-full h-full overflow-y-auto scrollbar-none  mt-4 md:overflow-y-auto">

                <p id="message"></p>





            </div>
        </aside>

        <!-- preview -->
        <section class="w-full ml-125 md:flex-1 bg-[#151D33] p-4 rounded-xl">

            <div class="relative">

                <video autoplay src="https://media.w3.org/2010/05/sintel/trailer.mp4" id="preview-video"
                    class="w-full aspect-video autoplay object-cover rounded-xl bg-black" controls playsinline
                    preload="metadata" aria-label="Selected channel video">
                    Your browser does not support HTML video.
                </video>
                <!-- <img id="preview-image" class="w-full aspect-video object-cover rounded-xl"
                    src=""
                    alt="Stream preview"> -->

                <span
                    class="absolute top-3 left-3 bg-[#20C997] text-[#0B1020] text-xs font-bold px-3 py-1 rounded-full">
                    LIVE
                </span>
            </div>

            <h2 id="preview-title" class="font-bold text-2xl mt-4">2M</h2>



        </section>

    </main>

    <script type="module" src="js/app.js"></script>

</body>

</html>
